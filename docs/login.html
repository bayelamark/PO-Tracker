<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login | PO Tracker</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <a href="index.html">
      <img
        src="PO-Tracker-White.png"
        alt="PO Tracker"
        class="logo"
      >
    </a>
  </header>

  <main class="auth-page">
    <section class="auth-container">
      <div class="auth-form">
        <h1>Log In</h1>

        <form id="loginForm">
          <label for="loginEmail">Email</label>

          <input
            type="email"
            id="loginEmail"
            required
          >

          <label for="loginPassword">Password</label>

          <input
            type="password"
            id="loginPassword"
            required
          >

          <button type="submit">
            Log In
          </button>
        </form>

        <p id="loginMessage"></p>
      </div>

      <div class="auth-form">
        <h1>Create Account</h1>

        <form id="registerForm">
          <label for="registerName">Name</label>

          <input
            type="text"
            id="registerName"
            required
          >

          <label for="registerEmail">Email</label>

          <input
            type="email"
            id="registerEmail"
            required
          >

          <label for="registerPassword">
            Password
          </label>

          <input
            type="password"
            id="registerPassword"
            minlength="8"
            required
          >

          <button type="submit">
            Create Account
          </button>
        </form>

        <p id="registerMessage"></p>
      </div>
    </section>
  </main>

  <script src="auth.js?v=2"></script>
  <script src="script.js?v=11"></script>
</body>
</html>
