<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Profile | PO Tracker</title>

  <link rel="stylesheet" href="style.css?v=4">
</head>

<body>
  <header>
    <a href="index.html">
      <img
        src="PO-Tracker-White.png"
        alt="PO Tracker"
        class="logo"
      >
    </a>

    <nav class="main-nav">
      <a href="index.html">My Collection</a>
      <a href="search.html">Search</a>
      <a href="profile.html">Profile</a>

      <button
        type="button"
        id="logoutButton"
        class="logout-button"
      >
        Log Out
      </button>
    </nav>
  </header>

  <main class="profile-page">
    <section class="profile-card">
      <h1>My Profile</h1>

      <div class="profile-detail">
        <span>Name</span>
        <strong id="profileName">Loading...</strong>

        <form id="nameForm" class="profile-name-form">
          <label for="profileNameInput">
            Edit Name
          </label>

          <input
            type="text"
            id="profileNameInput"
            required
         >

          <button type="submit">
            Save Name
          </button>
       </form>

        <p id="profileMessage"></p>
      </div>

      <div class="profile-detail">
        <span>Email</span>
        <strong id="profileEmail">Loading...</strong>
      </div>
    </section>
  </main>

  <script src="auth.js?v=2"></script>
  <script src="profile.js?v=2"></script>
</body>
</html>
